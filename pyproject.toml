[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hypocurate"
version = "0.1.0"
description = "Tests a scientific hypothesis in words against registered data sources."
requires-python = ">=3.12"
# Direct dependencies. The exact versions installed, with hashes, are in
# requirements.lock and requirements-dev.lock (pip-compile --generate-hashes).
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    # Step 7: the statistics module (numpy linear algebra, scipy t and binomial distributions).
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
# statsmodels: the independent reference implementation of the statistics, test side only (step 7).
dev = ["pytest>=8", "httpx2>=2.13", "pyyaml>=6", "statsmodels>=0.14"]

[project.scripts]
hypocurate = "hypocurate.cli:main"

[tool.setuptools.packages.find]
include = ["hypocurate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

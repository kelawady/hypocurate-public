[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hypocurate"
version = "0.1.0"
description = "Tests a scientific hypothesis in words against registered data sources."
requires-python = ">=3.12"
# Direct dependencies. The exact versions installed, with hashes, are in
# requirements.lock and requirements-dev.lock (pip-compile --generate-hashes).
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    # Step 7: the statistics module (numpy linear algebra, scipy t and binomial distributions).
    "numpy>=2.0",
    "scipy>=1.14",
    # Step 8: the agents (DSPy modules; model calls through litellm).
    "dspy>=3.4",
    "litellm>=1.104",
]

[project.optional-dependencies]
# statsmodels: the independent reference implementation of the statistics, test side only (step 7).
dev = ["pytest>=8", "httpx2>=2.13", "pyyaml>=6", "statsmodels>=0.14", "pytest-xdist>=3.6"]

[project.scripts]
hypocurate = "hypocurate.cli:main"

[tool.setuptools.packages.find]
include = ["hypocurate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Step 10a (owner, 2026-10-11): 2 parallel workers (4 overloaded the 2-core machines; owner's overnight rule); the tests in conftest.SERIAL_FILES share one worker (loadgroup).
addopts = "-ra -n 2 --dist loadgroup"
markers = ["xdist_group(name): tests that run one after another on one xdist worker (tests/conftest.py)"]
